name: Release Olive DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Build and Package Olive.dmg
        run: |
          chmod +x ./scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Olive-*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
